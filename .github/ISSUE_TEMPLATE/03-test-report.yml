name: Test report / Prueba
description: Report a successful, partial, failed or inconclusive test.
title: "[Test] "
labels: [testing, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Positive and negative results are equally useful. English or español welcome. Test away from an active show, using disposable configurations and independent backups. This report is public: redact private data. See [community testing](https://github.com/marmoles-supply/wing-controller/blob/main/docs/COMMUNITY_TESTING.md).
  - type: input
    id: version
    attributes:
      label: App version and build
      description: Find them in Properties → About. For a source build, include the commit.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area tested
      options:
        - Installation or update
        - Save, load or recovery
        - Macro triggers and IF conditions
        - Actions, waits or fades
        - Meters and channel selection
        - Inter-app MIDI or OSC
        - LTC, MTC or timecode cues
        - Notices or HUD
        - Accessibility or interface
        - Another area (describe below)
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Test setup
      description: Mac chip/model family, macOS and relevant console model/firmware, audio interface or app versions. Say whether this was offline, with hardware, or an existing-use observation. No serials, discovery names or private addresses.
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: What did you test, and what result did you expect?
      description: Give repeatable steps, synthetic channel examples, duration/repetitions and the boundary of the test.
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      default: 3
      options:
        - Worked as expected
        - Partly worked
        - Failed
        - Could not complete / inconclusive
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What did you observe?
      description: Include limitations and differences from the expected result. For console writes, distinguish app indication from an independently observed console change.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and related work (optional)
      description: Reviewed screenshots, short redacted logs, a workaround or a linked bug/roadmap task. A pass applies only to the setup and scope reported.
