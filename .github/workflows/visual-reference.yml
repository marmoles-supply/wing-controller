name: Capture visual reference for review
on:
  push:
    branches: [codex/visual-reference]
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: c03deee5d666c4d42cd5483ba859f5d27fec0750
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.8.2
      - run: npm ci --no-audit --no-fund
      - name: Record renderer
        run: |
          mkdir -p capture-evidence
          {
            git rev-parse HEAD
            sw_vers
            uname -m
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
          } > capture-evidence/environment.log
      - name: Repeat complete captures with software Canvas 2D
        shell: bash
        run: |
          mkdir -p capture-evidence/samples
          printf '%s\n' '#!/bin/sh' 'exec "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --disable-accelerated-2d-canvas "$@"' > "$RUNNER_TEMP/canvas-chrome"
          chmod +x "$RUNNER_TEMP/canvas-chrome"
          for sample in 1 2 3; do
            out="capture-evidence/samples/canvas-$sample"
            mkdir -p "$out"
            WING_CHROME_BIN="$RUNNER_TEMP/canvas-chrome" node scripts/test-design-screens.mjs --write > "$out/capture.log" 2>&1
            cp design/screens/*.png "$out/"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: software-canvas-candidate
          path: |
            capture-evidence/
          retention-days: 7
          if-no-files-found: error
