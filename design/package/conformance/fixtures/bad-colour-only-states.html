<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>conformance fixture · states told apart by colour alone</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="fixture.css">
</head>
<body>
  <!-- RULE 6. The three words are declared, but two of the states are the same word and the same shape, and differ
       only in colour. -->
  <div class="card" id="decision" data-state-set="yes no unknown">
    <span class="chip" data-state="yes" style="background: var(--green)">OK</span>
    <span class="chip" data-state="no" style="background: var(--red)">OK</span>
  </div>
</body>
</html>
